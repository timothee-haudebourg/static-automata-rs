[workspace]
members = [
	"builder",
	"cli"
]

[workspace.package]
edition = "2021"
authors = ["Timothée Haudebourg <author@haudebourg.net>"]
categories = ["parsing"]
keywords = ["parsing", "abnf", "grammar", "regular"]
repository = "https://github.com/timothee-haudebourg/static-automata"
documentation = "https://docs.rs/static-automata"
license = "MIT/Apache-2.0"
readme = "README.md"
version = "3.0.0"

[workspace.dependencies]
static-automata-builder = { path = "builder" }
syn = "2.0.18"
quote = "1.0.29"
proc-macro2 = "1.0.60"
thiserror = "2.0"

[package]
name = "static-automata"
description = "Derive macro for static regular grammar"
edition.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
documentation.workspace = true
license.workspace = true
readme.workspace = true
version.workspace = true

[dependencies]
static-automata-macros = { path = "macros" }